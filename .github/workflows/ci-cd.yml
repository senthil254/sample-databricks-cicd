name: databricks-cicd-demo

on:
  # Allows running the pipeline by hand from the Actions tab, e.g. to retry
  # after changing a secret without needing a throwaway commit.
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    env:
      # OAuth machine-to-machine (service principal). Preferred over a personal
      # access token: not tied to a human account, and scoped independently.
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: PYTEST_ADDOPTS='' PYTHONDONTWRITEBYTECODE=1 pytest -c pytest-ci.ini tests

      - name: Set up Databricks CLI
        # Pinned: tracking @main lets upstream changes break CI without a commit here.
        uses: databricks/setup-cli@v1.17.0

      - name: Validate bundle
        run: databricks bundle validate --target dev

      - name: Deploy bundle to dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: databricks bundle deploy --target dev

      - name: Run deployed job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: databricks bundle run demo_validation_job --target dev
