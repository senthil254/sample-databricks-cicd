bundle:
  name: databricks-cicd-demo

include:
  - resources/*.yml

variables:
  notification_email:
    description: Email address for job failure notifications
    default: johnvik@networth.awsapps.com

workspace:
  host: https://dbc-f818cfa1-b8d3.cloud.databricks.com

targets:
  dev:
    default: true
    mode: development
    workspace:
      # current_user resolves for both a human and a service principal, so the
      # same config deploys locally and from CI without editing paths.
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
